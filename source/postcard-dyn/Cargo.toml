[package]
name = "postcard-dyn"
version = "0.5.0"
authors = ["James Munns <me@jamesmunns.com>"]
edition = "2024"
rust-version = "1.88"
readme = "README.md"
repository = "https://github.com/jamesmunns/postcard"
description = "Dynamic ser/de for postcard"
license = "MIT OR Apache-2.0"
categories = [
    "encoding",
]
keywords = [
    "serde",
    "postcard",
    "schema",
]
documentation = "https://docs.rs/postcard-dyn/"

[dependencies]
serde = { version = "1.0.202", features = ["derive"] }
serde_json = "1.0.117"

[dependencies.postcard-core]
version = "0.2.0"
features = ["alloc"]
path = "../postcard-core"

[dependencies.postcard-schema]
version = "0.5.0"
features = ["std", "derive"]
path = "../postcard-schema"

[dev-dependencies.postcard]
version = "2.0.0"
features = ["alloc"]
path = "../postcard"
