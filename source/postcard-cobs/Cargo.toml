[package]
name = "postcard-cobs"
version = "0.3.0"
authors = ["James Munns <james@onevariable.com>"]
edition = "2024"
rust-version = "1.88"
readme = "README.md"
repository = "https://github.com/jamesmunns/postcard"
description = "COBS framing for postcard"
license = "MIT OR Apache-2.0"
categories = [
    "embedded",
    "no-std",
]
keywords = [
    "serde",
    "cobs",
    "framing",
]
documentation = "https://docs.rs/postcard-cobs/"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
postcard = { version = "2.0.0", path = "../postcard", default-features = false }
serde_core = { version = "1.0.228", default-features = false }

[features]
alloc = ["postcard/alloc"]

[dev-dependencies]
serde = { version = "1.0", features = ["derive"] }
