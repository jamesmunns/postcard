[package]
name = "postcard-schema-ng"
version = "0.4.1"
authors = ["James Munns <me@jamesmunns.com>"]
edition = "2021"
rust-version = "1.88"
readme = "README.md"
repository = "https://github.com/jamesmunns/postcard"
description = "Reflection-like schemas for postcard types"
license = "MIT OR Apache-2.0"
categories = [
    "embedded",
    "no-std",
]
keywords = [
    "serde",
]
documentation = "https://docs.rs/postcard-schema-ng/"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]

[dependencies.postcard-core]
version = "0.2.0"
path = "../postcard-core"

[dependencies.serde]
version = "1.0"
default-features = false
# todo: remove this?
features = ["derive"]

[dependencies.uuid_v1_0]
package = "uuid"
version = "1.0"
default-features = false
optional = true

[dependencies.chrono_v0_4]
package = "chrono"
version = "0.4"
default-features = false
optional = true

[dependencies.heapless_v0_7]
package = "heapless"
version = "0.7"
default-features = false
optional = true

[dependencies.heapless_v0_8]
package = "heapless"
version = "0.8"
default-features = false
optional = true

[dependencies.heapless_v0_9]
package = "heapless"
version = "0.9.4"
default-features = false
optional = true

[dependencies.nalgebra_v0_33]
package = "nalgebra"
version = "0.33.0"
optional = true
default-features = false

[dependencies.nalgebra_v0_34]
package = "nalgebra"
version = "0.34.1"
optional = true
default-features = false

[dependencies.fixed_v1_0]
package = "fixed"
version = "1.0"
optional = true
default-features = false

[dependencies.postcard-derive-ng]
path = "../postcard-derive-ng"
version = "0.3.0"
optional = true

[dependencies.defmt_v0_3]
package = "defmt"
version = "0.3.5"
optional = true

[dependencies.serde-big-array_v0_5]
package = "serde-big-array"
version = "0.5.1"
optional = true

[dependencies.enum-map_v3_0]
package = "enum-map"
version = "3.0.0"
default-features = false
optional = true

[dev-dependencies.postcard]
path = "../postcard"
version = "2.0.0"
features = ["alloc"]

[dev-dependencies.nalgebra_v0_33]
package = "nalgebra"
version = "0.33.0"
default-features = false
features = ["serde-serialize-no-std"]

[dev-dependencies.nalgebra_v0_34]
package = "nalgebra"
version = "0.34.1"
default-features = false
features = ["serde-serialize-no-std"]

[dev-dependencies.uuid_v1_0]
package = "uuid"
version = "1.0"
default-features = false
features = ["serde"]

[dev-dependencies.chrono_v0_4]
package = "chrono"
version = "0.4"
default-features = false
features = ["serde", "clock"]

[[test]]
name = "schema"
required-features = ["derive", "std"]

[features]
default = []
std = ["serde/std"]
alloc = ["serde/alloc"]
derive = ["dep:postcard-derive-ng"]

core-net = []
core-num-saturating = []

chrono-v0_4 = ["dep:chrono_v0_4"]
defmt-v0_3 = ["dep:defmt_v0_3"]
# requires msrv 1.95
enum-map-v3_0 = ["dep:enum-map_v3_0"]
fixed-v1_0 = ["dep:fixed_v1_0"]
heapless-v0_7 = ["dep:heapless_v0_7"]
heapless-v0_8 = ["dep:heapless_v0_8"]
heapless-v0_9 = ["dep:heapless_v0_9"]
nalgebra-v0_33 = ["dep:nalgebra_v0_33"]
nalgebra-v0_34 = ["dep:nalgebra_v0_34"]
serde-big-array-v0_5 = ["dep:serde-big-array_v0_5"]
uuid-v1_0 = ["dep:uuid_v1_0"]
