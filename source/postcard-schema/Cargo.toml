[package]
name = "postcard-schema"
version = "0.5.0"
authors = ["James Munns <me@jamesmunns.com>"]
edition = "2021"
rust-version = "1.88"
readme = "README.md"
repository = "https://github.com/jamesmunns/postcard"
description = "Reflection-like schemas for postcard types"
license = "MIT OR Apache-2.0"
categories = [
    "embedded",
    "no-std",
]
keywords = [
    "serde",
]
documentation = "https://docs.rs/postcard-schema/"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]

[dependencies.postcard-core]
version = "0.2.0"
path = "../postcard-core"

[dependencies.serde]
version = "1.0"
default-features = false
# todo: remove this?
features = ["derive"]

[dependencies.uuid_v1_0]
package = "uuid"
version = "1.0"
default-features = false
optional = true

[dependencies.chrono_v0_4]
package = "chrono"
version = "0.4"
default-features = false
optional = true

[dependencies.heapless_v0_7]
package = "heapless"
version = "0.7"
default-features = false
optional = true

[dependencies.heapless_v0_8]
package = "heapless"
version = "0.8"
default-features = false
optional = true

[dependencies.heapless_v0_9]
package = "heapless"
version = "0.9.4"
default-features = false
optional = true

[dependencies.nalgebra_v0_33]
package = "nalgebra"
version = "0.33.0"
optional = true
default-features = false

[dependencies.nalgebra_v0_34]
package = "nalgebra"
version = "0.34.1"
optional = true
default-features = false

[dependencies.fixed_v1_0]
package = "fixed"
version = "1.0"
optional = true
default-features = false

[dependencies.bytes_v1_0]
package = "bytes"
version = "1.0"
optional = true
default-features = false

[dependencies.indexmap_v2_0]
package = "indexmap"
version = "2.0"
optional = true
default-features = false

[dependencies.log_v0_4]
package = "log"
version = "0.4"
optional = true
default-features = false

[dependencies.postcard-derive]
path = "../postcard-derive"
version = "0.4.0"
optional = true

[dependencies.defmt]
version = "1"
optional = true

[dependencies.serde-big-array_v0_5]
package = "serde-big-array"
version = "0.5.1"
optional = true

[dependencies.postcard-schema_v0_2]
package = "postcard-schema"
version = "0.2.6"
default-features = false
features = ["alloc"]
optional = true

[dependencies.postcard-schema-ng_v0_4]
package = "postcard-schema-ng"
version = "0.4.1"
default-features = false
features = ["alloc"]
optional = true

[dependencies.enum-map_v3_0]
package = "enum-map"
version = "3.0.0"
default-features = false
optional = true

[dev-dependencies.serde]
version = "1.0"
features = ["rc"]

[dev-dependencies.postcard]
path = "../postcard"
version = "2.0.0"
features = ["alloc"]

[dev-dependencies.nalgebra_v0_33]
package = "nalgebra"
version = "0.33.0"
default-features = false
features = ["serde-serialize-no-std"]

[dev-dependencies.nalgebra_v0_34]
package = "nalgebra"
version = "0.34.1"
default-features = false
features = ["serde-serialize-no-std"]

[dev-dependencies.uuid_v1_0]
package = "uuid"
version = "1.0"
default-features = false
features = ["serde"]

[dev-dependencies.chrono_v0_4]
package = "chrono"
version = "0.4"
default-features = false
features = ["serde", "clock"]

[dev-dependencies.heapless_v0_7]
package = "heapless"
version = "0.7"
default-features = false
features = ["serde"]

[dev-dependencies.heapless_v0_8]
package = "heapless"
version = "0.8"
default-features = false
features = ["serde"]

[dev-dependencies.heapless_v0_9]
package = "heapless"
version = "0.9.4"
default-features = false
features = ["serde"]

[dev-dependencies.fixed_v1_0]
package = "fixed"
version = "1.0"
default-features = false
features = ["serde"]

[dev-dependencies.bytes_v1_0]
package = "bytes"
version = "1.0"
features = ["serde"]

[dev-dependencies.indexmap_v2_0]
package = "indexmap"
version = "2.0"
features = ["serde"]

[dev-dependencies.log_v0_4]
package = "log"
version = "0.4"
features = ["serde"]

# The crates that version 2 keys must match, for tests/key_v2.rs
[dev-dependencies.postcard-schema_v0_2]
package = "postcard-schema"
version = "0.2.6"
features = [
    "derive",
    "use-std",
    "core-net",
    "core-num-saturating",
    "chrono-v0_4",
    "fixed-v1_0",
    "heapless-v0_8",
    "nalgebra-v0_33",
    "serde-big-array-v0_5",
    "uuid-v1_0",
]

[dev-dependencies.postcard-schema-ng_v0_4]
package = "postcard-schema-ng"
version = "0.4.1"
features = [
    "derive",
    "use-std",
    "core-net",
    "core-num-saturating",
    "chrono-v0_4",
    "fixed-v1_0",
    "heapless-v0_8",
    "nalgebra-v0_33",
    "serde-big-array-v0_5",
    "uuid-v1_0",
]

[[test]]
name = "schema"
required-features = ["derive", "std"]

[features]
default = []
std = ["serde/std"]
alloc = ["serde/alloc"]
derive = ["dep:postcard-derive"]
# version 2 key hashing, for peers that still use it
legacy-key-v2 = []
# postcard-schema 0.2's owned schema types, to read schemas from older devices
legacy-schema-v0_2 = ["std", "dep:postcard-schema_v0_2"]
# postcard-schema-ng 0.4's owned schema types, to read schemas from older devices
legacy-schema-ng-v0_4 = ["std", "dep:postcard-schema-ng_v0_4"]

bytes-v1_0 = ["dep:bytes_v1_0"]
chrono-v0_4 = ["dep:chrono_v0_4"]
defmt-v1 = ["dep:defmt"]
# requires msrv 1.95
enum-map-v3_0 = ["dep:enum-map_v3_0"]
fixed-v1_0 = ["dep:fixed_v1_0"]
heapless-v0_7 = ["dep:heapless_v0_7"]
heapless-v0_8 = ["dep:heapless_v0_8"]
heapless-v0_9 = ["dep:heapless_v0_9"]
indexmap-v2_0 = ["dep:indexmap_v2_0"]
log-v0_4 = ["dep:log_v0_4"]
nalgebra-v0_33 = ["dep:nalgebra_v0_33"]
nalgebra-v0_34 = ["dep:nalgebra_v0_34"]
serde-big-array-v0_5 = ["dep:serde-big-array_v0_5"]
uuid-v1_0 = ["dep:uuid_v1_0"]

[[test]]
name = "verify"
required-features = ["derive", "std"]

[[test]]
name = "verify_impls"
required-features = ["derive", "std"]

[[test]]
name = "key_v2"
required-features = ["derive", "std", "legacy-key-v2"]
