[package]
name = "postcard2"
version = "0.2.1"
authors = ["James Munns <james@onevariable.com>"]
edition = "2024"
rust-version = "1.85"
readme = "README.md"
repository = "https://github.com/jamesmunns/postcard"
description = "A no_std + serde compatible message library for Rust"
license = "MIT OR Apache-2.0"
categories = [
    "embedded",
    "no-std",
]
keywords = [
    "serde",
]
documentation = "https://docs.rs/postcard2/"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]

[dependencies.postcard-core]
version = "0.2.0"
path = "../postcard-core"

# todo: make this versioned, optional?
[dependencies.serde_core]
version = "1.0.228"
default-features = false

[dependencies.defmt]
version = "1"
optional = true

[dependencies.serde_derive]
version = "1.0.228"
optional = true
default-features = false

[dependencies.serde]
version = "1.0.228"
default-features = false
optional = true

[dev-dependencies]
serde = { version = "1.0.228", features = ["derive"] }

[features]
default = []
std = ["postcard-core/alloc"]
alloc = ["postcard-core/alloc"]

defmt-v1 = ["dep:defmt", "postcard-core/defmt-v1"]
serde-derive = ["dep:serde_derive", "dep:serde"]
