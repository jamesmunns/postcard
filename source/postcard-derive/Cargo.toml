[package]
name = "postcard-derive"
version = "0.4.0-rc.1"
authors = [
    "Lachlan Sneff <lachlan.sneff@gmail.com>",
    "James Munns <james@onevariable.com>",
]
edition = "2024"
rust-version = "1.88"
readme = "README.md"
repository = "https://github.com/jamesmunns/postcard"
description = "A no_std + serde compatible message library for Rust - Derive Crate"
license = "MIT OR Apache-2.0"
categories = [
    "embedded",
    "no-std",
]
keywords = [
    "serde",
    "postcard",
    "schema",
    "derive",
]
documentation = "https://docs.rs/postcard-derive/"

[lib]
proc-macro = true

[package.metadata.docs.rs]
all-features = true

[dependencies]
syn = ">= 2.0, < 4"
quote = "1.0"
proc-macro2 = "1.0"
