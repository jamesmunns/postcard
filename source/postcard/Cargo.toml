[package]
name = "postcard"
version = "2.0.0-rc.0"
authors = ["James Munns <james@onevariable.com>"]
edition = "2024"
rust-version = "1.85"
readme = "README.md"
repository = "https://github.com/jamesmunns/postcard"
description = "A no_std + serde compatible message library for Rust"
license = "MIT OR Apache-2.0"
categories = [
    "embedded",
    "no-std",
]
keywords = [
    "serde",
]
documentation = "https://docs.rs/postcard/"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]

[dependencies.postcard-core]
version = "1.0.0-rc.0"
path = "../postcard-core"

[dependencies.serde_core_v1]
package = "serde_core"
version = "1.0.228"
default-features = false

[dependencies.defmt]
version = "1"
optional = true

[dev-dependencies]
serde = { version = "1.0.228", features = ["derive"] }

[features]
default = []
std = ["postcard-core/alloc"]
alloc = ["postcard-core/alloc"]

defmt-v1 = ["dep:defmt", "postcard-core/defmt-v1"]
