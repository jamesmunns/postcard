[package]
name = "postcard-heapless"
version = "0.3.0-rc.0"
authors = ["James Munns <james@onevariable.com>"]
edition = "2024"
rust-version = "1.88"
readme = "README.md"
repository = "https://github.com/jamesmunns/postcard"
description = "postcard extension crate"
license = "MIT OR Apache-2.0"
categories = [
    "embedded",
    "no-std",
]
keywords = [
    "serde",
]
documentation = "https://docs.rs/postcard-heapless/"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
postcard = { version = "2.0.0-rc.0", path = "../postcard", default-features = false, optional = true }
serde_core = { version = "1.0.228", default-features = false, optional = true }

[dependencies.heapless_v0_9]
package = "heapless"
version = "0.9.4"
optional = true
default-features = false
features = ["serde"]

[features]
heapless-v0_9 = ["dep:heapless_v0_9", "dep:postcard", "dep:serde_core"]

[dev-dependencies]
serde = { version = "1.0", features = ["derive"] }
