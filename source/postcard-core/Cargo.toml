[package]
name = "postcard-core"
version = "0.2.0"
authors = ["James Munns <james@onevariable.com>"]
edition = "2024"
rust-version = "1.85"
readme = "README.md"
repository = "https://github.com/jamesmunns/postcard"
description = "A no_std compatible message library for Rust"
license = "MIT OR Apache-2.0"
categories = [
    "embedded",
    "no-std",
]
keywords = []
documentation = "https://docs.rs/postcard-core/"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]

[dependencies.defmt]
version = "1"
optional = true

[features]
alloc = []
defmt-v1 = ["dep:defmt"]
